# ProTeGi Dry-Run Configuration (联调冒烟配置)
# 严格限制搜索步数与单步扩展规模，用于端到端连通性与产物输出验证。

prompt_scope: "constrained"
experiment_pair_id: "protegi-prompt-scope-v1-dryrun"

optimization_steps: 1
beam_width: 1
minibatch_size: 8
errors_per_group: 1
gradients_per_error_group: 1
max_error_groups: 1
edits_per_gradient: 1
paraphrases_per_edit: 1
successors_per_parent: 2
total_pull_budget_per_round: 6
eval_batch_size: 2
min_pulls_per_candidate: 2
ucb_c: 2.0
seed: 42

max_docs_train: 2
max_docs_dev: 2

task_model: "hy3"
task_max_workers: 8
task_temperature: 0.0
task_thinking: "disabled"
task_reasoning_effort: "none"
task_top_p: 0.95
task_max_tokens: 4096

optimizer_model: "muse-spark-1.3-contributor"
optimizer_temperature: 0.1
optimizer_thinking: "disabled"
optimizer_reasoning_effort: "xhigh"
optimizer_top_p: 1.0
optimizer_max_tokens: 16384
