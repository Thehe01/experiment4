# Configuration-targeted constrained ProTeGi pilot. Prepared only; not run.

prompt_scope: "constrained"
experiment_pair_id: "protegi-configuration-pilot-v1"

# Fixed input context shared identically by P0 and every generated candidate.
document_abbreviation_context: true
vulnerability_anchored_backfill: true

# Train search and gradient input are both Configuration-specific.
selection_entity_type: "Configuration"
error_focus_entity_type: "Configuration"

# Frozen Dev is read only once after Train search. P0 may win automatically.
final_selection_entity_type: "Configuration"
include_p0_in_final_selection: true
guardrail_entity_types:
  - "Vulnerability"
  - "Weakness"
  - "AttackTechnique"
guardrail_max_f1_drop: 0.02

optimization_steps: 2
beam_width: 2
minibatch_size: 8
errors_per_group: 4
gradients_per_error_group: 1
max_error_groups: 1
edits_per_gradient: 1
paraphrases_per_edit: 1
successors_per_parent: 1
total_pull_budget_per_round: 8
eval_batch_size: 8
min_pulls_per_candidate: 2
ucb_c: 2.0
seed: 42

task_model: "hy3"
task_max_workers: 8
task_temperature: 0.0
task_thinking: "disabled"
task_reasoning_effort: "none"
task_top_p: 0.95
task_max_tokens: 4096

optimizer_model: "muse-spark-1.3-contributor"
optimizer_temperature: 0.1
optimizer_thinking: "disabled"
optimizer_reasoning_effort: "xhigh"
optimizer_top_p: 1.0
optimizer_max_tokens: 16384
